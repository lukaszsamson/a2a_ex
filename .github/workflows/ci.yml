name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.16"
            otp: "26"
          - elixir: "1.20"
            otp: "29"
    steps:
      - uses: actions/checkout@v6
      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Install dependencies
        run: mix deps.get
      - name: Check format
        run: mix format --check-formatted
      - name: Run tests
        run: mix test
      - name: Run dialyzer
        run: mix dialyzer
        if: matrix.elixir == '1.20'

  v1-interop:
    name: A2A v1.0 SDK and TCK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Install Elixir dependencies
        run: mix deps.get
      - name: Run official Python SDK interoperability
        run: scripts/run_v1_python_sdk.sh
      - name: Run official A2A TCK MUST profile
        run: scripts/run_v1_tck.sh --level must

  spec_lint:
    name: Spec lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          otp-version: "29"
      - name: Install dependencies
        run: mix deps.get
      - name: Run spec_lint
        run: mix spec_lint
